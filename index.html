<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded">
        <h3>🔎 Buscador Lambayeque (Datos Locales)</h3>
        <input type="text" id="cui" class="form-control mb-2" placeholder="Ingrese CUI">
        <button class="btn btn-primary w-100" onclick="buscar()">BUSCAR</button>
        <div id="res" class="mt-4"></div>
    </div>

    <script>
        async function buscar() {
            const cui = document.getElementById('cui').value;
            const div = document.getElementById('res');
            div.innerHTML = "Buscando...";
            
            try {
                // Cargamos tus JSON propios
                const resp = await fetch('data_detalle.json');
                const data = await resp.json();
                const proy = data.find(x => x.CODIGO_UNICO == cui);

                if(proy) {
                    div.innerHTML = `<div class="alert alert-success">
                        <h5>${proy.NOMBRE_INVERSION}</h5>
                        <p>Costo: S/ ${proy.COSTO_ACTUALIZADO}</p>
                    </div>`;
                } else {
                    div.innerHTML = "No encontrado en Lambayeque.";
                }
            } catch(e) { div.innerHTML = "Error cargando datos locales."; }
        }
    </script>
</body>
</html>
