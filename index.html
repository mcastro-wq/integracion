<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Lambayeque - Consulta Triple SQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-bg { background: #1a2a6c; color: white; padding: 2rem 0; margin-bottom: 2rem; border-bottom: 5px solid #b21f1f; }
        .data-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; height: 100%; }
        .label-custom { font-size: 0.8rem; color: #666; text-transform: uppercase; font-weight: bold; }
        #loader { display: none; }
    </style>
</head>
<body class="bg-light">

<div class="header-bg shadow">
    <div class="container text-center">
        <h1>📊 Seguimiento de Inversiones</h1>
        <p>Consulta en tiempo real: Detalle, F12B y Estado Situacional</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="input-group input-group-lg mb-4">
                <input type="text" id="cuiInput" class="form-control" placeholder="Ingrese CUI (ej. 3043981)">
                <button class="btn btn-danger" onclick="consultarMEF()">BUSCAR</button>
            </div>
            <div id="loader" class="text-center mb-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Cruzando datos de las 3 fuentes SQL...</p>
            </div>
        </div>
    </div>

    <div id="resultado" class="row d-none">
        </div>
</div>

<script>
async function consultarMEF() {
    const cui = document.getElementById('cuiInput').value.trim();
    const resDiv = document.getElementById('resultado');
    const loader = document.getElementById('loader');

    if (!cui) return;

    loader.style.display = "block";
    resDiv.classList.add('d-none');

    // TUS 3 ENLACES SQL (IDs de Recursos)
    const ids = {
        detalle: "f9cc4ba0-931a-4b70-86c9-eacbd8c68596",
        f12b: "c275fa9f-5c61-4313-828d-0827277bdd97",
        situacion: "2c20b8e2-7bd9-41ba-8239-8f8c9571935a"
    };

    const proxy = "https://corsproxy.io/?";
    const baseUrl = "https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql?sql=";

    // Queries basadas en tus diccionarios (usando CODIGO_UNICO)
    const queries = {
        detalle: `SELECT * FROM "${ids.detalle}" WHERE "CODIGO_UNICO" = '${cui}'`,
        f12b: `SELECT * FROM "${ids.f12b}" WHERE "CODIGO_UNICO" = '${cui}'`,
        situacion: `SELECT * FROM "${ids.situacion}" WHERE "CODIGO_UNICO" = '${cui}'`
    };

    try {
        // Ejecutamos las 3 consultas al mismo tiempo
        const [rDet, rF12, rSit] = await Promise.all([
            fetch(proxy + encodeURIComponent(baseUrl + queries.detalle)).then(r => r.json()),
            fetch(proxy + encodeURIComponent(baseUrl + queries.f12b)).then(r => r.json()),
            fetch(proxy + encodeURIComponent(baseUrl + queries.situacion)).then(r => r.json())
        ]);

        if (rDet.success && rDet.result.records.length > 0) {
            const d = rDet.result.records[0];
            const f = rF12.result.records[0] || {};
            const s = rSit.result.records[0] || {};

            resDiv.innerHTML = `
                <div class="col-12 mb-4">
                    <div class="card shadow p-4 border-0">
                        <span class="badge bg-primary mb-2" style="width: fit-content;">CUI: ${d.CODIGO_UNICO}</span>
                        <h3 class="fw-bold">${d.NOMBRE_INVERSION || d.INVERSION_NOMBRE}</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="data-card bg-white shadow-sm">
                        <h5 class="border-bottom pb-2">📂 Detalle Inversión</h5>
                        <label class="label-custom">Costo Actualizado</label>
                        <p class="fw-bold text-success">S/ ${parseFloat(d.COSTO_ACTUALIZADO || 0).toLocaleString()}</p>
                        <label class="label-custom">Beneficiarios</label>
                        <p>${d.BENEFICIARIOS || 'No especificado'}</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="data-card bg-white shadow-sm">
                        <h5 class="border-bottom pb-2">📝 Formato 12B</h5>
                        <label class="label-custom">Avance Financiero</label>
                        <p class="fw-bold">${f.AVANCE_FINANCIERO || d.AVANCE_FINANCIERO || 0}%</p>
                        <label class="label-custom">Acción a realizar</label>
                        <p>${f.ACCION_REALIZAR || 'No registra acción en 12B'}</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="data-card bg-white shadow-sm border-danger">
                        <h5 class="border-bottom pb-2 text-danger">⚠️ Estado Situacional</h5>
                        <label class="label-custom">Descripción del Problema</label>
                        <p class="small text-danger">${s.DESCRIPCION_SITUACION || 'Sin problemáticas reportadas en esta fuente.'}</p>
                        <label class="label-custom">Última Actualización</label>
                        <p>${s.FECHA_REGISTRO || 'No disponible'}</p>
                    </div>
                </div>
            `;
            resDiv.classList.remove('d-none');
        } else {
            alert("No se encontró información para el CUI ingresado.");
        }
    } catch (e) {
        alert("Error al conectar con la API del MEF. Reintente en unos segundos.");
    } finally {
        loader.style.display = "none";
    }
}
</script>
</body>
</html>
