<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard MEF - Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .header-custom { background: #004080; color: white; padding: 30px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .filter-card { border: none; border-radius: 15px; margin-top: -25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .res-table { background: white; border-radius: 12px; overflow: hidden; }
        .badge-cui { font-family: monospace; font-size: 1rem; }
        .detail-pane { display: none; background-color: #f8f9fa; border-left: 5px solid #004080; }
        .money { font-weight: 600; color: #2d5a27; }
    </style>
</head>
<body>

<div class="header-custom text-center">
    <h2>Sincronización MEF - Reporte Regional</h2>
    <p id="subtitulo">Visualizando Inversiones de LAMBAYEQUE</p>
</div>

<div class="container mb-5">
    <div class="card filter-card p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-bold text-muted small">REGIÓN / DEPARTAMENTO</label>
                <select id="filtroRegion" class="form-select border-primary" onchange="actualizarSubtitulo()">
                    <option value="LAMBAYEQUE" selected>LAMBAYEQUE (Por defecto)</option>
                    <option value="AMAZONAS">AMAZONAS</option>
                    <option value="ANCASH">ANCASH</option>
                    <option value="APURIMAC">APURIMAC</option>
                    <option value="AREQUIPA">AREQUIPA</option>
                    <option value="AYACUCHO">AYACUCHO</option>
                    <option value="CAJAMARCA">CAJAMARCA</option>
                    <option value="CUSCO">CUSCO</option>
                    <option value="HUANCAVELICA">HUANCAVELICA</option>
                    <option value="HUANUCO">HUANUCO</option>
                    <option value="ICA">ICA</option>
                    <option value="JUNIN">JUNIN</option>
                    <option value="LA LIBERTAD">LA LIBERTAD</option>
                    <option value="LIMA">LIMA</option>
                    <option value="LORETO">LORETO</option>
                    <option value="MADRE DE DIOS">MADRE DE DIOS</option>
                    <option value="MOQUEGUA">MOQUEGUA</option>
                    <option value="PASCO">PASCO</option>
                    <option value="PIURA">PIURA</option>
                    <option value="PUNO">PUNO</option>
                    <option value="SAN MARTIN">SAN MARTIN</option>
                    <option value="TACNA">TACNA</option>
                    <option value="TUMBES">TUMBES</option>
                    <option value="UCAYALI">UCAYALI</option>
                    <option value="TODOS">-- VER TODO EL PAÍS --</option>
                </select>
            </div>
            <div class="col-md-7">
                <label class="form-label fw-bold text-muted small">BÚSQUEDA ESPECÍFICA</label>
                <input type="text" id="searchInput" class="form-control" placeholder="CUI, Nombre del Proyecto o Entidad Ejecutora...">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100 fw-bold" onclick="realizarBusqueda()">ACTUALIZAR</button>
            </div>
        </div>
    </div>

    <div id="loader" class="text-center d-none my-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-2">Consultando registros...</p>
    </div>

    <div class="res-table shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Códigos</th>
                    <th style="width: 40%;">Inversión / Ubicación</th>
                    <th>Presupuesto (PIM)</th>
                    <th>Ejecución Física</th>
                    <th>Estado</th>
                    <th>Ficha</th>
                </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>
</div>

<script>
    const TOTAL_PARTES = 30; // Ajusta según el número de archivos en tu repo

    // Carga inicial automática
    window.onload = () => realizarBusqueda();

    function actualizarSubtitulo() {
        const reg = document.getElementById('filtroRegion').value;
        document.getElementById('subtitulo').innerText = reg === "TODOS" ? "Visualizando Inversiones a Nivel Nacional" : `Visualizando Inversiones de ${reg}`;
    }

    async function realizarBusqueda() {
        const regionFiltro = document.getElementById('filtroRegion').value;
        const textoFiltro = document.getElementById('searchInput').value.trim().toUpperCase();
        const loader = document.getElementById('loader');
        const body = document.getElementById('tablaBody');
        
        loader.classList.remove('d-none');
        body.innerHTML = "";
        let encontrados = [];

        try {
            for (let i = 1; i <= TOTAL_PARTES; i++) {
                const response = await fetch(`data_detalle_parte_${i}.json`);
                if (!response.ok) break;
                const data = await response.json();

                const filtrados = data.filter(item => {
                    // Lógica de Filtro por Región
                    const cumpleRegion = (regionFiltro === "TODOS") || (item.DEPARTAMENTO === regionFiltro);
                    
                    // Lógica de Filtro por Texto (CUI, Nombre o Entidad)
                    const cumpleTexto = !textoFiltro || 
                                       (item.CODIGO_UNICO && item.CODIGO_UNICO.toString().includes(textoFiltro)) ||
                                       (item.NOMBRE_INVERSION && item.NOMBRE_INVERSION.includes(textoFiltro)) ||
                                       (item.ENTIDAD && item.ENTIDAD.includes(textoFiltro));

                    return cumpleRegion && cumpleTexto;
                });

                encontrados = [...encontrados, ...filtrados];
                // Limitar a 100 resultados para mantener fluidez
                if (encontrados.length >= 100) break;
            }
            renderTable(encontrados);
        } catch (e) {
            body.innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Error conectando con los datos locales.</td></tr>`;
        } finally {
            loader.classList.add('d-none');
        }
    }

    function renderTable(lista) {
        const body = document.getElementById('tablaBody');
        if (lista.length === 0) {
            body.innerHTML = `<tr><td colspan="6" class="text-center p-5 text-muted">No se encontraron inversiones con esos criterios.</td></tr>`;
            return;
        }

        lista.forEach((p, index) => {
            const detailId = `detail-${index}`;
            const row = `
                <tr>
                    <td>
                        <span class="badge bg-primary badge-cui">CUI: ${p.CODIGO_UNICO}</span><br>
                        <small class="text-muted">SNIP: ${p.CODIGO_SNIP || '---'}</small>
                    </td>
                    <td>
                        <div class="fw-bold text-dark mb-1" style="font-size: 0.85rem;">${p.NOMBRE_INVERSION}</div>
                        <div class="small">
                            <span class="text-primary fw-bold">${p.PROVINCIA} / ${p.DISTRITO}</span><br>
                            <span class="text-muted" style="font-size: 0.75rem;">🏛️ ${p.ENTIDAD}</span>
                        </div>
                    </td>
                    <td>
                        <div class="money">S/ ${parseFloat(p.PIM_ANIO_ACTUAL || 0).toLocaleString()}</div>
                        <small class="text-muted">Dev: S/ ${parseFloat(p.DEV_ANIO_ACTUAL || 0).toLocaleString()}</small>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="progress w-100 me-2" style="height: 10px;">
                                <div class="progress-bar bg-success" style="width: ${p.AVANCE_FISICO || 0}%"></div>
                            </div>
                            <span class="small fw-bold">${p.AVANCE_FISICO || 0}%</span>
                        </div>
                        <small class="text-muted" style="font-size: 0.7rem;">Ejecución: ${p.AVANCE_EJECUCION || 0}%</small>
                    </td>
                    <td>
                        <span class="badge ${p.ESTADO === 'ACTIVO' ? 'bg-success' : 'bg-warning text-dark'}">${p.ESTADO || 'DESCONOCIDO'}</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="toggleDetail('${detailId}')">Detalle</button>
                    </td>
                </tr>
                <tr id="${detailId}" class="detail-pane">
                    <td colspan="6" class="p-4">
                        <div class="row">
                            <div class="col-md-4">
                                <h6 class="fw-bold border-bottom pb-2">Información Técnica</h6>
                                <strong>Unidad Formuladora:</strong> ${p.NOMBRE_UF}<br>
                                <strong>Modalidad:</strong> ${p.DES_MODALIDAD}<br>
                                <strong>Tipología:</strong> ${p.DES_TIPOLOGIA || '---'}
                            </div>
                            <div class="col-md-4">
                                <h6 class="fw-bold border-bottom pb-2">Presupuesto Acumulado</h6>
                                <strong>Costo Actualizado:</strong> S/ ${parseFloat(p.COSTO_ACTUALIZADO || 0).toLocaleString()}<br>
                                <strong>Saldo por Ejecutar:</strong> <span class="text-danger">S/ ${parseFloat(p.SALDO_EJECUTAR || 0).toLocaleString()}</span><br>
                                <strong>Monto Viable:</strong> S/ ${parseFloat(p.MONTO_VIABLE || 0).toLocaleString()}
                            </div>
                            <div class="col-md-4">
                                <h6 class="fw-bold border-bottom pb-2">Cronograma y Beneficio</h6>
                                <strong>Inicio Programado:</strong> ${p.FEC_INI_EJECUCION || '---'}<br>
                                <strong>Termino Programado:</strong> ${p.FEC_FIN_EJECUCION || '---'}<br>
                                <strong>Beneficiarios:</strong> ${parseInt(p.NUM_HABITANTES_BENEF || 0).toLocaleString()} personas
                            </div>
                        </div>
                    </td>
                </tr>
            `;
            body.insertAdjacentHTML('beforeend', row);
        });
    }

    function toggleDetail(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'table-row') ? 'none' : 'table-row';
    }
</script>

</body>
</html>
