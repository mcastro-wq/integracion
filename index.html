<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Inversiones MEF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: #003366; color: white; padding: 30px 0; margin-bottom: 30px; border-bottom: 4px solid #d9534f; }
        .search-box { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-res { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-badge { font-size: 0.75rem; padding: 5px 10px; border-radius: 12px; }
        #loader { display: none; }
    </style>
</head>
<body>

<div class="header-bg text-center">
    <h2>🔍 Buscador de Inversiones MEF</h2>
    <p>Consulta integrada de Detalle, Avances y Situación</p>
</div>

<div class="container">
    <div class="search-box mb-4">
        <div class="row g-3">
            <div class="col-md-9">
                <label class="form-label fw-bold">Buscar por CUI o Nombre del Proyecto</label>
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Ej: 2460241 o 'Mejoramiento de colegio...'">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-primary w-100 btn-lg" onclick="realizarBusqueda()">BUSCAR</button>
            </div>
        </div>
    </div>

    <div id="loader" class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Consultando bases de datos locales...</p>
    </div>

    <div id="resultadosContenedor" class="table-res d-none">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>CUI / SNIP</th>
                    <th>Inversión / Entidad</th>
                    <th>Sector</th>
                    <th>Costo Act.</th>
                    <th>Avance</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>
</div>

<script>
    // Configuración: Define cuántas partes tienes en tu repo (data_detalle_parte_1...X)
    const TOTAL_PARTES = 30; 

    // Al cargar la página, mostramos los primeros 100 registros (Precarga)
    window.onload = () => realizarBusqueda(true);

    async function realizarBusqueda(esPrecarga = false) {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        const loader = document.getElementById('loader');
        const contenedor = document.getElementById('resultadosContenedor');
        const body = document.getElementById('tablaBody');

        loader.style.display = "block";
        if(!esPrecarga) contenedor.classList.add('d-none');
        body.innerHTML = "";

        let resultados = [];
        const limiteRegistros = esPrecarga ? 100 : 500; // Si es búsqueda manual, permitimos más resultados

        try {
            for (let i = 1; i <= TOTAL_PARTES; i++) {
                const res = await fetch(`data_detalle_parte_${i}.json`);
                if (!res.ok) break;
                const data = await res.json();

                let filtrados = [];
                if (esPrecarga || query === "") {
                    filtrados = data; // En precarga tomamos todo hasta completar el límite
                } else {
                    // Búsqueda inteligente: ¿Es número (CUI) o es texto (Nombre)?
                    const esNumero = !isNaN(query);
                    filtrados = data.filter(item => {
                        if (esNumero) {
                            return item.CODIGO_UNICO == query || item.COD_SNIP == query;
                        } else {
                            return item.NOMBRE_INVERSION && item.NOMBRE_INVERSION.includes(query);
                        }
                    });
                }

                resultados = [...resultados, ...filtrados];

                // Detenerse si ya alcanzamos el límite de visualización
                if (resultados.length >= limiteRegistros) {
                    resultados = resultados.slice(0, limiteRegistros);
                    break;
                }
                
                // Si buscamos un CUI específico y lo encontramos, paramos
                if (!esPrecarga && !isNaN(query) && resultados.length > 0) break;
            }

            renderizarResultados(resultados);
        } catch (e) {
            console.error("Error cargando datos:", e);
            body.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error al cargar archivos JSON locales.</td></tr>`;
        } finally {
            loader.style.display = "none";
            contenedor.classList.remove('d-none');
        }
    }

    function renderizarResultados(lista) {
        const body = document.getElementById('tablaBody');
        if (lista.length === 0) {
            body.innerHTML = `<tr><td colspan="6" class="text-center p-4">No se encontraron resultados para su búsqueda.</td></tr>`;
            return;
        }

        lista.forEach(p => {
            const fila = `
                <tr>
                    <td>
                        <div class="fw-bold text-primary">${p.CODIGO_UNICO || '---'}</div>
                        <small class="text-muted">SNIP: ${p.COD_SNIP || 'N/A'}</small>
                    </td>
                    <td>
                        <div style="max-width: 400px; font-size: 0.85rem;" class="fw-semibold">${p.NOMBRE_INVERSION}</div>
                        <div class="text-muted small" style="font-size: 0.75rem;">🏛️ ${p.ENTIDAD || 'SIN ENTIDAD'}</div>
                    </td>
                    <td><span class="small">${p.SECTOR || '---'}</span></td>
                    <td class="fw-bold text-dark">S/ ${parseFloat(p.COSTO_ACTUALIZADO || 0).toLocaleString()}</td>
                    <td>
                        <div class="progress" style="height: 8px; width: 80px;">
                            <div class="progress-bar bg-success" style="width: ${p.AVANCE_FISICO || 0}%"></div>
                        </div>
                        <small>${p.AVANCE_FISICO || 0}%</small>
                    </td>
                    <td>
                        <span class="status-badge ${p.ESTADO_NOMBRE === 'Activo' ? 'bg-success text-white' : 'bg-warning text-dark'}">
                            ${p.ESTADO_NOMBRE || 'Desconocido'}
                        </span>
                    </td>
                </tr>
            `;
            body.insertAdjacentHTML('beforeend', fila);
        });
    }
</script>

</body>
</html>
