<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container shadow bg-white p-4 rounded">
        <h3>🔍 Buscador de Inversiones Lambayeque</h3>
        <div class="input-group my-3">
            <input type="text" id="cuiInput" class="form-control" placeholder="Ingrese CUI...">
            <button class="btn btn-dark" onclick="consultar()">Buscar Proyecto</button>
        </div>
        <div id="resultado"></div>
    </div>

    <script>
        async function consultar() {
            const cui = document.getElementById('cuiInput').value;
            const res = document.getElementById('resultado');
            res.innerHTML = "Buscando...";

            try {
                // Cargamos los archivos que generó el Actions
                const [d, s, f] = await Promise.all([
                    fetch('data_detalle.json').then(r => r.json()),
                    fetch('data_situacion.json').then(r => r.json()),
                    fetch('data_f12b.json').then(r => r.json())
                ]);

                // Buscamos el CUI en los tres
                const detalle = d.find(x => x.CODIGO_UNICO == cui || x.CODIGO_INVERSION == cui);
                const situacion = s.find(x => x.CODIGO_UNICO == cui || x.COD_UNICO == cui);
                
                if(!detalle) {
                    res.innerHTML = "<div class='alert alert-warning'>No se encontró el CUI en Lambayeque.</div>";
                    return;
                }

                res.innerHTML = `
                    <div class="card p-3 border-primary">
                        <h4>${detalle.NOMBRE_INVERSION}</h4>
                        <p><strong>Costo Actualizado:</strong> S/ ${detalle.COSTO_ACTUALIZADO}</p>
                        <hr>
                        <h5>⚠️ Situación Actual:</h5>
                        <p class="text-danger">${situacion ? situacion.DESCRIPCION_SITUACION : 'Sin problemas registrados'}</p>
                    </div>
                `;
            } catch (e) {
                res.innerHTML = "Error al leer los datos. Asegúrate de que el Actions haya terminado.";
            }
        }
    </script>
</body>
</html>
