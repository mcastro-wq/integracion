<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Regional - Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-header { background: #1a1a1a; color: white; font-weight: bold; }
        .bg-invierte { background: #900; }
        .highlight-card { border-left: 5px solid #900; }
        .table-container { max-height: 400px; overflow-y: auto; }
        tr.selected { background-color: #fff3f3 !important; border: 2px solid #900; }
    </style>
</head>
<body class="bg-light p-4">

<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="fw-bold">CONTROL ESTRATÉGICO DE INVERSIONES - LAMBAYEQUE</h2>
            <p class="text-muted">Consulta en tiempo real de la cartera regional</p>
        </div>
        <div class="col-md-4">
            <div class="input-group shadow-sm">
                <input type="text" id="inputBusqueda" class="form-control" placeholder="Ingrese CUI o nombre del proyecto...">
                <button class="btn btn-dark" onclick="buscarProyecto()">Buscar</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card h-100 shadow highlight-card">
                <div class="card-header bg-dark">DETALLE DE LA INVERSIÓN SELECCIONADA</div>
                <div class="card-body" id="detalleProyecto">
                    <h5 class="text-muted text-center py-5">Seleccione un proyecto de la lista o ingrese un CUI para ver el detalle</h5>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header d-flex justify-content-between align-items-center">
                    LISTADO GENERAL DE PROYECTOS
                    <span class="badge bg-secondary" id="countProyectos">0 registros</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-container">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>CUI</th>
                                    <th>Nombre del Proyecto</th>
                                    <th>Avance %</th>
                                    <th>PIM 2026</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCuerpo">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let dataCompleta = [];

    async function cargarBaseDeDatos() {
        try {
            const res = await fetch('data_cruzada.json?v=' + new Date().getTime());
            dataCompleta = await res.json();
            document.getElementById('countProyectos').innerText = dataCompleta.length + " proyectos";
            renderizarTabla(dataCompleta);
        } catch (e) {
            console.error("Error cargando JSON:", e);
        }
    }

    function renderizarTabla(lista) {
        const cuerpo = document.getElementById('tablaCuerpo');
        cuerpo.innerHTML = lista.map(p => `
            <tr style="cursor:pointer" onclick="mostrarDetalle('${p.cui}')">
                <td><span class="badge bg-light text-dark border">${p.cui}</span></td>
                <td class="small text-uppercase">${p.nombre.substring(0, 80)}...</td>
                <td>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-success" style="width: ${p.avance_fisico_porc}%"></div>
                    </div>
                    <small>${p.avance_fisico_porc}%</small>
                </td>
                <td class="fw-bold text-nowrap">S/ ${p.pim_2026.toLocaleString()}</td>
            </tr>
        `).join('');
    }

async function buscarProyecto() {
    const cui = document.getElementById('inputBusqueda').value;

    // Cargar los 3 archivos en paralelo
    const [resDet, resSit, res12b] = await Promise.all([
        fetch('data_detalle.json'),
        fetch('data_situacion.json'),
        fetch('data_f12b.json')
    ]);

    const detalle = await resDet.json();
    const situacion = await resSit.json();
    const f12b = await res12b.json();

    // 1. Buscar en Detalle
    const proyecto = detalle.find(p => p.CODIGO_UNIC == cui || p.CODIGO_UNICO == cui);

    if (proyecto) {
        // 2. Buscar su problemática en Situación
        const sit = situacion.find(s => s.CODIGO_UNIC == cui || s.CODIGO_UNICO == cui);
        
        // 3. Buscar su avance en 12B
        const seg = f12b.find(f => f.CODIGO_UNIC == cui || f.CODIGO_UNICO == cui);

        // Mostrar todo en el HTML...
        actualizarUI(proyecto, sit, seg);
    }
}

    function mostrarDetalle(cui) {
        const inv = dataCompleta.find(p => p.cui === cui);
        if (!inv) return;

        const detalleDiv = document.getElementById('detalleProyecto');
        detalleDiv.innerHTML = `
            <h4 class="fw-bold text-primary mb-3">${inv.nombre}</h4>
            <div class="row mb-3">
                <div class="col-6">
                    <small class="text-muted d-block">ESTADO</small>
                    <span class="badge bg-info">${inv.estado_invierte}</span>
                </div>
                <div class="col-6 text-end">
                    <small class="text-muted d-block">AVANCE FÍSICO</small>
                    <h3 class="fw-bold text-success">${inv.avance_fisico_porc}%</h3>
                </div>
            </div>
            <hr>
            <div class="mb-3">
                <p class="mb-1 text-muted small">COSTO ACTUALIZADO</p>
                <h4 class="fw-bold text-dark">S/ ${inv.costo_actualizado.toLocaleString()}</h4>
            </div>
            <div class="p-3 bg-light rounded border-start border-4 border-danger mb-3">
                <h6 class="fw-bold text-danger">PROBLEMÁTICA ACTUAL:</h6>
                <p class="small mb-0">${inv.estado_situacional_mef}</p>
            </div>
            <div class="p-3 bg-light rounded border-start border-4 border-success">
                <h6 class="fw-bold text-success">PRÓXIMOS PASOS (F12B):</h6>
                <p class="small mb-0">${inv.seguimiento_proximos_pasos}</p>
            </div>
            <div class="mt-4">
                <small class="text-muted">Unidad Ejecutora: ${inv.unidad_ejecutora}</small>
            </div>
        `;
    }

    // Escuchar Enter en el buscador
    document.getElementById('inputBusqueda').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscarProyecto();
    });

    window.onload = cargarBaseDeDatos;
</script>
</body>
</html>
