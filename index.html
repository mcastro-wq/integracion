<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronización MEF - Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
        .hero-section { background: linear-gradient(135deg, #003366 0%, #004080 100%); color: white; padding: 40px 0; border-bottom: 5px solid #cc0000; }
        .search-card { border: none; border-radius: 15px; transform: translateY(-30px); }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .badge-cui { font-family: monospace; font-size: 1rem; }
        .status-pill { border-radius: 20px; padding: 5px 15px; font-size: 0.85rem; font-weight: 600; }
        #loader { display: none; }
    </style>
</head>
<body>

<div class="hero-section">
    <div class="container text-center">
        <h1 class="fw-extrabold">📊 Dashboard de Inversiones</h1>
        <p class="lead">Información extraída directamente de los CSV del MEF</p>
    </div>
</div>

<div class="container">
    <div class="card search-card shadow-lg p-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-bold">Buscar por CUI</label>
                <input type="number" id="cuiInput" class="form-control" placeholder="Ej: 2460241">
            </div>
            <div class="col-md-5">
                <label class="form-label fw-bold">Nombre del Proyecto</label>
                <input type="text" id="nombreInput" class="form-control" placeholder="Palabra clave en el nombre...">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Año de Registro</label>
                <select id="anioSelect" class="form-select">
                    <option value="">Todos los años</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                </select>
            </div>
            <div class="col-12 mt-4 text-center">
                <button class="btn btn-primary btn-lg px-5 shadow-sm" onclick="iniciarBusqueda()">
                    🔍 CONSULTAR BASES DE DATOS
                </button>
            </div>
        </div>
    </div>

    <div id="loader" class="text-center my-4">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="mt-2 text-muted fw-bold">Escaneando archivos JSON locales...</p>
    </div>

    <div class="table-container mb-5 d-none" id="tablaResultados">
        <h4 class="mb-4 fw-bold">Resultados de Inversión</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>CUI</th>
                        <th>Nombre de Inversión</th>
                        <th>Costo Actualizado</th>
                        <th>Avance Físico</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="listaInversiones">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Configuración: Define cuántas partes generó tu script de Python
    const TOTAL_PARTES = 10; 

    async function iniciarBusqueda() {
        const cui = document.getElementById('cuiInput').value.trim();
        const nombre = document.getElementById('nombreInput').value.trim().toUpperCase();
        const anio = document.getElementById('anioSelect').value;
        const loader = document.getElementById('loader');
        const tabla = document.getElementById('tablaResultados');
        const lista = document.getElementById('listaInversiones');

        loader.style.display = "block";
        tabla.classList.add('d-none');
        lista.innerHTML = "";

        let resultadosEncontrados = [];

        // Buscador secuencial en los archivos JSON locales generados por el Action
        for (let i = 1; i <= TOTAL_PARTES; i++) {
            try {
                const response = await fetch(`data_detalle_parte_${i}.json`);
                if (!response.ok) break; // Si no existe el archivo, termina
                
                const data = await response.json();
                
                // Aplicar filtros
                const filtrados = data.filter(p => {
                    const matchCui = cui ? p.CODIGO_UNICO == cui : true;
                    const matchNombre = nombre ? (p.NOMBRE_INVERSION && p.NOMBRE_INVERSION.includes(nombre)) : true;
                    // El año se extrae de la fecha de registro o viabilidad del CSV
                    const matchAnio = anio ? (p.FECHA_VIABILIDAD && p.FECHA_VIABILIDAD.includes(anio)) : true;
                    return matchCui && matchNombre && matchAnio;
                });

                resultadosEncontrados = [...resultadosEncontrados, ...filtrados];
                
                // Si buscamos por CUI y lo encontramos, no necesitamos leer más partes
                if (cui && resultadosEncontrados.length > 0) break;

            } catch (error) {
                console.error(`Error leyendo parte ${i}:`, error);
            }
        }

        renderTabla(resultadosEncontrados);
        loader.style.display = "none";
    }

    function renderTabla(datos) {
        const tabla = document.getElementById('tablaResultados');
        const lista = document.getElementById('listaInversiones');

        if (datos.length === 0) {
            alert("No se encontraron registros con esos filtros.");
            return;
        }

        datos.forEach(p => {
            const fila = `
                <tr>
                    <td><span class="badge bg-secondary badge-cui">${p.CODIGO_UNICO}</span></td>
                    <td class="small fw-bold">${p.NOMBRE_INVERSION || 'SIN DATOS'}</td>
                    <td class="text-success fw-bold">S/ ${parseFloat(p.COSTO_ACTUALIZADO || 0).toLocaleString()}</td>
                    <td>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar bg-success" style="width: ${p.AVANCE_FISICO || 0}%"></div>
                        </div>
                        <small>${p.AVANCE_FISICO || 0}%</small>
                    </td>
                    <td><span class="status-pill bg-info text-dark">${p.ESTADO_NOMBRE || 'Activo'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-dark" onclick="alert('CUI: ${p.CODIGO_UNICO}\\nCosto: S/ ${p.COSTO_ACTUALIZADO}')">Ver más</button>
                    </td>
                </tr>
            `;
            lista.innerHTML += fila;
        });

        tabla.classList.remove('d-none');
    }
</script>

</body>
</html>
