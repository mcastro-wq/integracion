<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador CUI Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded">
        <h4>🔎 Buscador por CUI (Lambayeque)</h4>
        <div class="input-group my-3">
            <input type="text" id="cuiInput" class="form-control" placeholder="Escriba el CUI (ej. 3043981)">
            <button class="btn btn-primary" onclick="buscar()">Buscar</button>
        </div>
        <div id="resultado"></div>
    </div>

    <script>
        async function buscar() {
            const cui = document.getElementById('cuiInput').value.trim();
            const div = document.getElementById('resultado');
            if(!cui) return;
            
            div.innerHTML = "Buscando en la base de datos...";

            try {
                // Leemos los JSON locales generados por el Action
                const [det, sit] = await Promise.all([
                    fetch('data_detalle.json').then(r => r.json()),
                    fetch('data_situacion.json').then(r => r.json())
                ]);

                // Buscamos el CUI (usamos == para comparar número con texto)
                const p = det.find(x => x.CODIGO_UNICO == cui);
                const s = sit.find(x => x.CODIGO_UNICO == cui);

                if(p) {
                    div.innerHTML = `
                        <div class="alert alert-success mt-3">
                            <h5>${p.NOMBRE_INVERSION || p.INVERSION_NOMBRE}</h5>
                            <p><strong>Costo:</strong> S/ ${p.COSTO_ACTUALIZADO || 'No disp.'}</p>
                            <p><strong>Situación:</strong> ${s ? s.DESCRIPCION_SITUACION : 'Sin reporte de problemas'}</p>
                        </div>`;
                } else {
                    div.innerHTML = "<div class='alert alert-danger mt-3'>CUI no encontrado en los datos de Lambayeque.</div>";
                }
            } catch (e) {
                div.innerHTML = "Error al cargar los datos. Verifica que el Action haya terminado.";
            }
        }
    </script>
</body>
</html>
