<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Regional - Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-header { background: #1a1a1a; color: white; font-weight: bold; }
        .bg-invierte { background: #900; }
        .highlight-card { border-left: 5px solid #900; }
        .table-container { max-height: 400px; overflow-y: auto; }
        tr.selected { background-color: #fff3f3 !important; border: 2px solid #900; }
    </style>
</head>
<body class="bg-light p-4">

<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="fw-bold">CONTROL ESTRATÉGICO DE INVERSIONES - LAMBAYEQUE</h2>
            <p class="text-muted">Consulta en tiempo real de la cartera regional</p>
        </div>
        <div class="col-md-4">
            <div class="input-group shadow-sm">
                <input type="text" id="inputBusqueda" class="form-control" placeholder="Ingrese CUI o nombre del proyecto...">
                <button class="btn btn-dark" onclick="buscarProyecto()">Buscar</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card h-100 shadow highlight-card">
                <div class="card-header bg-dark">DETALLE DE LA INVERSIÓN SELECCIONADA</div>
                <div class="card-body" id="detalleProyecto">
                    <h5 class="text-muted text-center py-5">Seleccione un proyecto de la lista o ingrese un CUI para ver el detalle</h5>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header d-flex justify-content-between align-items-center">
                    LISTADO GENERAL DE PROYECTOS
                    <span class="badge bg-secondary" id="countProyectos">0 registros</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-container">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>CUI</th>
                                    <th>Nombre del Proyecto</th>
                                    <th>Avance %</th>
                                    <th>PIM 2026</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCuerpo">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Variables globales para almacenar las bases de datos
    let dbDetalle = [];
    let dbSituacion = [];
    let db12b = [];

    // 1. Cargar las 3 bases de datos al iniciar la página
    async function cargarBaseDeDatos() {
        try {
            console.log("Cargando bases de datos...");
            const [resDet, resSit, res12b] = await Promise.all([
                fetch('data_detalle.json?v=' + Date.now()),
                fetch('data_situacion.json?v=' + Date.now()),
                fetch('data_f12b.json?v=' + Date.now())
            ]);

            dbDetalle = await resDet.json();
            dbSituacion = await resSit.json();
            db12b = await res12b.json();

            document.getElementById('countProyectos').innerText = dbDetalle.length + " proyectos";
            
            // Mostramos la tabla inicial con la data de detalle
            renderizarTabla(dbDetalle);
        } catch (e) {
            console.error("Error cargando archivos JSON:", e);
            document.getElementById('tablaCuerpo').innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error al cargar la data. Verifique que los archivos JSON existan en el repositorio.</td></tr>`;
        }
    }

    // 2. Función para dibujar la tabla principal
    function renderizarTabla(lista) {
        const cuerpo = document.getElementById('tablaCuerpo');
        cuerpo.innerHTML = lista.map(p => {
            // Buscamos el avance físico en la db12b para cada fila
            const f12 = db12b.find(f => f.CODIGO_UNICO == p.CODIGO_UNICO);
            const avance = f12 ? f12.AVANCE_FISICO : (p.AVANCE_FISICO || 0);
            
            return `
            <tr style="cursor:pointer" onclick="mostrarDetalle('${p.CODIGO_UNICO}')">
                <td><span class="badge bg-light text-dark border">${p.CODIGO_UNICO}</span></td>
                <td class="small text-uppercase">${(p.NOMBRE_INVERSION || 'SIN NOMBRE').substring(0, 80)}...</td>
                <td>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-success" style="width: ${avance}%"></div>
                    </div>
                    <small>${avance}%</small>
                </td>
                <td class="fw-bold text-nowrap">S/ ${p.PIM_ANIO_ACTUAL ? p.PIM_ANIO_ACTUAL.toLocaleString() : '0'}</td>
            </tr>`;
        }).join('');
    }

    // 3. Función de búsqueda (CUI o Nombre)
    function buscarProyecto() {
        const busqueda = document.getElementById('inputBusqueda').value.toUpperCase();
        
        // Filtramos sobre la base de detalle
        const filtrados = dbDetalle.filter(p => 
            p.CODIGO_UNICO.toString().includes(busqueda) || 
            p.NOMBRE_INVERSION.toUpperCase().includes(busqueda)
        );
        
        renderizarTabla(filtrados);

        // Si es un CUI exacto, mostramos el detalle automáticamente
        if (filtrados.length === 1 || dbDetalle.find(x => x.CODIGO_UNICO == busqueda)) {
            mostrarDetalle(busqueda);
        }
    }

    // 4. Función para mostrar el panel lateral de detalle cruzado
    function mostrarDetalle(cui) {
        // Buscamos en las 3 bolsas de datos
        const p = dbDetalle.find(x => x.CODIGO_UNICO == cui);
        const s = dbSituacion.find(x => x.CODIGO_UNICO == cui);
        const f = db12b.find(x => x.CODIGO_UNICO == cui);

        if (!p) return;

        const detalleDiv = document.getElementById('detalleProyecto');
        detalleDiv.innerHTML = `
            <h4 class="fw-bold text-primary mb-3">${p.NOMBRE_INVERSION}</h4>
            <div class="row mb-3">
                <div class="col-6">
                    <small class="text-muted d-block">ESTADO</small>
                    <span class="badge bg-info">${p.ESTADO || 'N/A'}</span>
                </div>
                <div class="col-6 text-end">
                    <small class="text-muted d-block">AVANCE FÍSICO (12B)</small>
                    <h3 class="fw-bold text-success">${f ? f.AVANCE_FISICO : (p.AVANCE_FISICO || 0)}%</h3>
                </div>
            </div>
            <hr>
            <div class="mb-3">
                <p class="mb-1 text-muted small">COSTO ACTUALIZADO</p>
                <h4 class="fw-bold text-dark">S/ ${p.COSTO_ACTUALIZADO ? p.COSTO_ACTUALIZADO.toLocaleString() : '0'}</h4>
            </div>
            <div class="p-3 bg-light rounded border-start border-4 border-danger mb-3">
                <h6 class="fw-bold text-danger">PROBLEMÁTICA (SITUACIONAL):</h6>
                <p class="small mb-0">${s ? s.DESCRIPCION : 'Sin reportes de problemática registrados.'}</p>
            </div>
            <div class="p-3 bg-light rounded border-start border-4 border-success">
                <h6 class="fw-bold text-success">PRÓXIMOS PASOS (12B):</h6>
                <p class="small mb-0">${f ? f.ACC_PROBLEMA : 'Continuar con la ejecución física programada.'}</p>
            </div>
            <div class="mt-4">
                <small class="text-muted">Unidad Ejecutora: ${p.NOMBRE_UEP || 'N/A'}</small>
            </div>
        `;
    }

    // Escuchar Enter
    document.getElementById('inputBusqueda').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscarProyecto();
    });

    window.onload = cargarBaseDeDatos;
</script>
</body>
</html>
