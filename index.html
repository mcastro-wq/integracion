<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Regional - Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-header { background: #1a1a1a; color: white; font-weight: bold; }
        .bg-invierte { background: #900; }
        .highlight-card { border-left: 5px solid #900; }
        .table-container { max-height: 400px; overflow-y: auto; }
        tr.selected { background-color: #fff3f3 !important; border: 2px solid #900; }
    </style>
</head>
<body class="bg-light p-4">

<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="fw-bold">CONTROL ESTRATÉGICO DE INVERSIONES - LAMBAYEQUE</h2>
            <p class="text-muted">Consulta en tiempo real de la cartera regional</p>
        </div>
        <div class="col-md-4">
            <div class="input-group shadow-sm">
                <input type="text" id="inputBusqueda" class="form-control" placeholder="Ingrese CUI o nombre del proyecto...">
                <button class="btn btn-dark" onclick="buscarProyecto()">Buscar</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card h-100 shadow highlight-card">
                <div class="card-header bg-dark">DETALLE DE LA INVERSIÓN SELECCIONADA</div>
                <div class="card-body" id="detalleProyecto">
                    <h5 class="text-muted text-center py-5">Seleccione un proyecto de la lista o ingrese un CUI para ver el detalle</h5>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header d-flex justify-content-between align-items-center">
                    LISTADO GENERAL DE PROYECTOS
                    <span class="badge bg-secondary" id="countProyectos">0 registros</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-container">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>CUI</th>
                                    <th>Nombre del Proyecto</th>
                                    <th>Avance %</th>
                                    <th>PIM 2026</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCuerpo">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let dbDetalle = [];
    let dbSituacion = [];
    let db12b = [];

    async function cargarBaseDeDatos() {
        try {
            // Cargamos los archivos crudos
            const [resDet, resSit, res12b] = await Promise.all([
                fetch('data_detalle.json'),
                fetch('data_situacion.json'),
                fetch('data_f12b.json')
            ]);

            const fullDetalle = await resDet.json();
            dbSituacion = await resSit.json();
            db12b = await res12b.json();

            // FILTRADO POR LAMBAYEQUE (Se hace aquí en el cliente)
            // Buscamos la columna departamento sin importar si tiene espacios o mayúsculas
            dbDetalle = fullDetalle.filter(p => {
                const dep = p.DEPARTAMENTO || p.departamento || p.Departamento;
                return dep && dep.toString().includes("LAMBAYEQUE");
            });

            document.getElementById('countProyectos').innerText = dbDetalle.length + " proyectos de Lambayeque";
            renderizarTabla(dbDetalle);

        } catch (e) {
            console.error("Error:", e);
        }
    }

    function buscarProyecto() {
        const busqueda = document.getElementById('inputBusqueda').value.toUpperCase();
        
        // Filtramos la lista de Lambayeque por CUI o Nombre
        const filtrados = dbDetalle.filter(p => 
            p.CODIGO_UNICO.toString().includes(busqueda) || 
            (p.NOMBRE_INVERSION && p.NOMBRE_INVERSION.toUpperCase().includes(busqueda))
        );
        
        renderizarTabla(filtrados);

        // Si encontramos el CUI exacto, cruzamos con los otros JSONs para el detalle
        if (dbDetalle.some(x => x.CODIGO_UNICO == busqueda)) {
            mostrarDetalle(busqueda);
        }
    }

    function mostrarDetalle(cui) {
        const p = dbDetalle.find(x => x.CODIGO_UNICO == cui);
        const s = dbSituacion.find(x => x.CODIGO_UNICO == cui);
        const f = db12b.find(x => x.CODIGO_UNICO == cui);

        if (!p) return;

        const detalleDiv = document.getElementById('detalleProyecto');
        detalleDiv.innerHTML = `
            <h4 class="fw-bold text-primary">${p.NOMBRE_INVERSION}</h4>
            <p><b>Estado:</b> ${p.ESTADO}</p>
            <p><b>Costo:</b> S/ ${p.COSTO_ACTUALIZADO.toLocaleString()}</p>
            <div class="alert alert-danger">
                <b>Problemática:</b> ${s ? s.DESCRIPCION : 'No registrada'}
            </div>
            <div class="alert alert-success">
                <b>Próximos Pasos:</b> ${f ? f.ACC_PROBLEMA : 'Continuar ejecución'}
            </div>
        `;
    }

    window.onload = cargarBaseDeDatos;
</script>
</body>
</html>
