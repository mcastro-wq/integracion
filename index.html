<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Inversiones MEF - Reporte Detallado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .header-section { background: linear-gradient(135deg, #1a2a6c, #b21f1f); color: white; padding: 40px 0; border-bottom: 5px solid #fdbb2d; }
        .card-stats { border: none; border-radius: 12px; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .badge-geo { background-color: #e9ecef; color: #495057; font-size: 0.7rem; font-weight: 600; margin-right: 5px; }
        .financial-val { font-family: 'Courier New', monospace; font-weight: bold; }
        .detail-row { background-color: #fdfdfe; display: none; }
        .progress { height: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header-section text-center">
    <h1>📊 Sistema de Seguimiento de Inversiones</h1>
    <p>Reporte Integrado: Formulación, Ejecución y Financiamiento</p>
</div>

<div class="container mt-n4">
    <div class="card card-stats p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-10">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Buscar por CUI, Nombre o Ubicación (Ej: Lambayeque)...">
            </div>
            <div class="col-md-2">
                <button class="btn btn-dark btn-lg w-100" onclick="realizarBusqueda()">FILTRAR</button>
            </div>
        </div>
    </div>

    <div id="loader" class="text-center d-none my-5">
        <div class="spinner-grow text-danger" role="status"></div>
        <p>Procesando registros del MEF...</p>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Identificación</th>
                        <th>Inversión / Localización</th>
                        <th>Financiamiento (S/)</th>
                        <th>Avances</th>
                        <th>Cronograma</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaInversiones"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const TOTAL_PARTES = 30;

    window.onload = () => realizarBusqueda();

    async function realizarBusqueda() {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        const loader = document.getElementById('loader');
        const body = document.getElementById('tablaInversiones');
        
        loader.classList.remove('d-none');
        body.innerHTML = "";

        let encontrados = [];

        try {
            for (let i = 1; i <= TOTAL_PARTES; i++) {
                const res = await fetch(`data_detalle_parte_${i}.json`);
                if (!res.ok) break;
                const data = await res.json();

                const filtrados = data.filter(item => {
                    return !query || 
                           (item.CODIGO_UNICO && item.CODIGO_UNICO.toString().includes(query)) ||
                           (item.NOMBRE_INVERSION && item.NOMBRE_INVERSION.includes(query)) ||
                           (item.DEPARTAMENTO && item.DEPARTAMENTO.includes(query)) ||
                           (item.ENTIDAD && item.ENTIDAD.includes(query));
                });

                encontrados = [...encontrados, ...filtrados];
                if (encontrados.length >= 100) break;
            }
            renderizar(encontrados);
        } catch (e) {
            body.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error al cargar datos.</td></tr>`;
        } finally {
            loader.classList.add('d-none');
        }
    }

    function renderizar(lista) {
        const body = document.getElementById('tablaInversiones');
        lista.forEach((p, index) => {
            const rowId = `detail-${index}`;
            const html = `
                <tr>
                    <td>
                        <span class="badge bg-primary mb-1">CUI: ${p.CODIGO_UNICO}</span><br>
                        <small class="text-muted">SNIP: ${p.CODIGO_SNIP || '---'}</small>
                    </td>
                    <td>
                        <div class="fw-bold" style="max-width: 350px; font-size: 0.85rem;">${p.NOMBRE_INVERSION}</div>
                        <div class="mt-1">
                            <span class="badge badge-geo">${p.DEPARTAMENTO}</span>
                            <span class="badge badge-geo">${p.PROVINCIA}</span>
                            <span class="badge badge-geo">${p.DISTRITO}</span>
                        </div>
                        <small class="text-danger d-block mt-1">🏛️ ${p.ENTIDAD}</small>
                    </td>
                    <td class="financial-val small">
                        PIM: ${parseFloat(p.PIM_ANIO_ACTUAL || 0).toLocaleString()}<br>
                        <span class="text-success">Dev: ${parseFloat(p.DEV_ANIO_ACTUAL || 0).toLocaleString()}</span><br>
                        <span class="text-muted">Saldo: ${parseFloat(p.SALDO_EJECUTAR || 0).toLocaleString()}</span>
                    </td>
                    <td>
                        <div class="small mb-1">Físico: ${p.AVANCE_FISICO || 0}%</div>
                        <div class="progress">
                            <div class="progress-bar bg-info" style="width: ${p.AVANCE_FISICO || 0}%"></div>
                        </div>
                        <div class="small mt-1 text-muted">Ejecución: ${p.AVANCE_EJECUCION || 0}%</div>
                    </td>
                    <td class="small">
                        Inicio: ${p.FEC_INI_EJECUCION || '---'}<br>
                        Fin: ${p.FEC_FIN_EJECUCION || '---'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary" onclick="toggleDetail('${rowId}')">Ver más</button>
                    </td>
                </tr>
                <tr id="${rowId}" class="detail-row">
                    <td colspan="6">
                        <div class="p-3 border rounded shadow-sm">
                            <div class="row">
                                <div class="col-md-4">
                                    <strong>Unidad Formuladora:</strong> ${p.NOMBRE_UF}<br>
                                    <strong>Tipología:</strong> ${p.DES_TIPOLOGIACarácter || '---'}<br>
                                    <strong>Modalidad:</strong> ${p.DES_MODALIDAD}
                                </div>
                                <div class="col-md-4">
                                    <strong>Función:</strong> ${p.FUNCION}<br>
                                    <strong>Programa:</strong> ${p.PROGRAMA}<br>
                                    <strong>Viabilidad:</strong> ${p.FECHA_VIABILIDAD}
                                </div>
                                <div class="col-md-4">
                                    <strong>Monto Viable:</strong> S/ ${parseFloat(p.MONTO_VIABLE || 0).toLocaleString()}<br>
                                    <strong>Costo Actualizado:</strong> S/ ${parseFloat(p.COSTO_ACTUALIZADO || 0).toLocaleString()}<br>
                                    <strong>Habitantes Beneficiados:</strong> ${parseInt(p.NUM_HABITANTES_BENEF || 0).toLocaleString()}
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
            body.insertAdjacentHTML('beforeend', html);
        });
    }

    function toggleDetail(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'table-row') ? 'none' : 'table-row';
    }
</script>

</body>
</html>
