<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador MEF en Tiempo Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-lg border-0 p-4">
        <h2 class="fw-bold mb-4">🔍 Consulta Directa MEF - Lambayeque</h2>
        
        <div class="input-group mb-3">
            <input type="text" id="busqueda" class="form-control form-control-lg" placeholder="Ingrese CUI o Nombre del proyecto...">
            <button class="btn btn-primary px-4" onclick="buscarEnMEF()">Buscar</button>
        </div>

        <div id="loader" class="text-center d-none my-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Consultando base de datos del MEF...</p>
        </div>

        <div id="resultados" class="mt-4">
            </div>
    </div>
</div>

<script>
async function buscarEnMEF() {
    const query = document.getElementById('busqueda').value.trim();
    const loader = document.getElementById('loader');
    const resultados = document.getElementById('resultados');

    if (!query) return alert("Escribe un CUI o nombre");

    loader.classList.remove('d-none');
    resultados.innerHTML = "";

    // IDs de los recursos del MEF
    const resDetalle = "f9cc4ba0-931a-4b70-86c9-eacbd8c68596";
    const resSituacion = "2c20b8e2-7bd9-41ba-8239-8f8c9571935a";

    // SQL: Buscamos por CUI (CODIGO_UNICO) o por Nombre
    // Filtramos para que siempre sea de Lambayeque
    const sql = `SELECT * FROM "${resDetalle}" WHERE ("CODIGO_UNICO" = '${query}' OR "NOMBRE_INVERSION" LIKE '%${query.toUpperCase()}%') AND "DEPARTAMENTO" LIKE '%LAMBAYEQUE%' LIMIT 5`;

    try {
        const response = await fetch(`https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql?sql=${encodeURIComponent(sql)}`);
        const data = await response.json();

        if (data.success && data.result.records.length > 0) {
            const p = data.result.records[0]; // Tomamos el primer resultado
            
            // Ahora buscamos su situación problemática en el otro recurso usando el CUI encontrado
            const cuiEncontrado = p.CODIGO_UNICO;
            const sqlSit = `SELECT * FROM "${resSituacion}" WHERE "CODIGO_UNICO" = '${cuiEncontrado}'`;
            const resSit = await fetch(`https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql?sql=${encodeURIComponent(sqlSit)}`);
            const dataSit = await resSit.json();
            const s = dataSit.result.records[0];

            resultados.innerHTML = `
                <div class="alert alert-success">
                    <h4>${p.NOMBRE_INVERSION}</h4>
                    <p class="mb-1"><strong>CUI:</strong> ${p.CODIGO_UNICO}</p>
                    <p class="mb-1"><strong>Costo:</strong> S/ ${parseFloat(p.COSTO_ACTUALIZADO).toLocaleString()}</p>
                    <p class="mb-1"><strong>Avance Financiero:</strong> ${p.AVANCE_FINANCIERO}%</p>
                    <hr>
                    <h5>⚠️ Situación Problemática:</h5>
                    <p class="text-danger">${s ? s.DESCRIPCION_SITUACION : 'No se reportan problemas registrados en la API.'}</p>
                </div>
            `;
        } else {
            resultados.innerHTML = `<div class="alert alert-warning">No se encontraron proyectos en Lambayeque con ese criterio.</div>`;
        }
    } catch (error) {
        console.error(error);
        resultados.innerHTML = `<div class="alert alert-danger">Error al conectar con la API del MEF.</div>`;
    } finally {
        loader.classList.add('d-none');
    }
}
</script>
</body>
</html>
