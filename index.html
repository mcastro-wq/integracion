<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Tripartita MEF - Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-detalle { border-top: 5px solid #0d6efd; }
        .card-f12b { border-top: 5px solid #198754; }
        .card-situacion { border-top: 5px solid #dc3545; }
        .label-data { font-size: 0.75rem; font-weight: bold; color: #555; text-transform: uppercase; display: block; margin-top: 10px; }
        .value-data { font-size: 1rem; color: #222; }
    </style>
</head>
<body class="bg-light p-4">

<div class="container bg-white shadow rounded p-4">
    <h2 class="text-center mb-4 fw-bold">🔎 Buscador Integrado MEF</h2>
    
    <div class="input-group input-group-lg mb-4">
        <input type="text" id="cuiInput" class="form-control" placeholder="Ingrese CUI a consultar...">
        <button class="btn btn-dark" onclick="consultarTodo()">CONSULTAR</button>
    </div>

    <div id="loader" class="text-center d-none my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Consultando diccionarios de datos...</p>
    </div>

    <div id="resultado" class="row g-3 d-none">
        </div>
</div>

<script>
async function consultarTodo() {
    const cui = document.getElementById('cuiInput').value.trim();
    const resDiv = document.getElementById('resultado');
    const loader = document.getElementById('loader');

    if (!cui) return;
    
    loader.classList.remove('d-none');
    resDiv.classList.add('d-none');

    // CONFIGURACIÓN DE TUS 3 ENLACES SQL
    const recursos = {
        detalle: "f9cc4ba0-931a-4b70-86c9-eacbd8c68596",
        f12b: "c275fa9f-5c61-4313-828d-0827277bdd97",
        situacion: "2c20b8e2-7bd9-41ba-8239-8f8c9571935a"
    };

    const proxy = "https://corsproxy.io/?";
    const apiBase = "https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql?sql=";

    // Queries basadas en la columna común CODIGO_UNICO
    const qDet = `SELECT * FROM "${recursos.detalle}" WHERE "CODIGO_UNICO" = '${cui}'`;
    const qF12 = `SELECT * FROM "${recursos.f12b}" WHERE "CODIGO_UNICO" = '${cui}'`;
    const qSit = `SELECT * FROM "${recursos.situacion}" WHERE "CODIGO_UNICO" = '${cui}'`;

    try {
        const [rDet, rF12, rSit] = await Promise.all([
            fetch(proxy + encodeURIComponent(apiBase + qDet)).then(res => res.json()),
            fetch(proxy + encodeURIComponent(apiBase + qF12)).then(res => res.json()),
            fetch(proxy + encodeURIComponent(apiBase + qSit)).then(res => res.json())
        ]);

        if (rDet.success && rDet.result.records.length > 0) {
            const d = rDet.result.records[0];
            const f = rF12.result.records[0] || {};
            const s = rSit.result.records[0] || {};

            resDiv.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-primary mb-0">
                        <h4 class="fw-bold mb-0">${d.NOMBRE_INVERSION || 'SIN NOMBRE'}</h4>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-detalle h-100 p-3 shadow-sm">
                        <h6 class="fw-bold text-primary">DATOS GENERALES</h6>
                        <span class="label-data">Costo Actualizado</span>
                        <div class="value-data">S/ ${parseFloat(d.COSTO_ACTUALIZADO || 0).toLocaleString()}</div>
                        
                        <span class="label-data">Beneficiarios</span>
                        <div class="value-data">${d.BENEFICIARIOS || 'No reg.'}</div>

                        <span class="label-data">Estado</span>
                        <div class="value-data">${d.ESTADO_NOMBRE || 'No reg.'}</div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-f12b h-100 p-3 shadow-sm">
                        <h6 class="fw-bold text-success">AVANCE (F12B)</h6>
                        <span class="label-data">Avance Físico Real</span>
                        <div class="value-data">${f.AVANCE_FISICO_REAL || 0}%</div>
                        
                        <span class="label-data">Devengado Acumulado</span>
                        <div class="value-data">S/ ${parseFloat(f.DEV_ACUMULADO || 0).toLocaleString()}</div>

                        <span class="label-data">Acción a realizar</span>
                        <div class="value-data text-success font-monospace small">${f.ACCION_REALIZAR_ESTADO || 'Sin registro en 12B'}</div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-situacion h-100 p-3 shadow-sm">
                        <h6 class="fw-bold text-danger">PROBLEMÁTICA</h6>
                        <span class="label-data">Última Situación</span>
                        <div class="value-data text-danger small">${s.DESCRIPCION_SITUACION || 'No presenta problemas registrados.'}</div>
                        
                        <span class="label-data">Fecha de Registro</span>
                        <div class="value-data">${s.FECHA_REGISTRO || '-'}</div>

                        <span class="label-data">Entidad Responsable</span>
                        <div class="value-data small">${s.ENTIDAD_NOMBRE || d.ENTIDAD_NOMBRE || '-'}</div>
                    </div>
                </div>
            `;
            resDiv.classList.remove('d-none');
        } else {
            resDiv.innerHTML = `<div class="col-12 alert alert-warning text-center">CUI no encontrado en Lambayeque (Detalle Inversiones).</div>`;
            resDiv.classList.remove('d-none');
        }
    } catch (error) {
        resDiv.innerHTML = `<div class="col-12 alert alert-danger text-center">Error al conectar con los servidores del MEF.</div>`;
        resDiv.classList.remove('d-none');
    } finally {
        loader.classList.add('d-none');
    }
}
</script>

</body>
</html>
