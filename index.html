<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Inversiones MEF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-resultado { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .mef-label { font-size: 0.75rem; color: #777; font-weight: bold; text-transform: uppercase; }
        .mef-value { font-size: 1rem; color: #333; margin-bottom: 15px; }
        #loader { display: none; }
    </style>
</head>
<body class="bg-light p-4">

<div class="container" style="max-width: 800px;">
    <div class="card p-4 mb-4 shadow-sm border-0">
        <h2 class="text-center fw-bold text-primary mb-4">🔎 Buscador de CUI Directo</h2>
        <div class="input-group input-group-lg">
            <input type="number" id="cuiInput" class="form-control" placeholder="Ingrese CUI (ej. 2460241)">
            <button class="btn btn-primary px-5" onclick="consultarMEF()">BUSCAR</button>
        </div>
        <div id="loader" class="text-center mt-3">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Consultando base de datos del MEF...</p>
        </div>
    </div>

    <div id="resultado" class="row g-3"></div>
</div>

<script>
async function consultarMEF() {
    const cui = document.getElementById('cuiInput').value.trim();
    const resDiv = document.getElementById('resultado');
    const loader = document.getElementById('loader');

    if (!cui) return;

    loader.style.display = "block";
    resDiv.innerHTML = "";

    // IDs de tus recursos MEF
    const ids = {
        detalle: "f9cc4ba0-931a-4b70-86c9-eacbd8c68596",
        f12b: "c275fa9f-5c61-4313-828d-0827277bdd97",
        situacion: "2c20b8e2-7bd9-41ba-8239-8f8c9571935a"
    };

    // Proxy y Base URL
    const proxy = "https://corsproxy.io/?";
    // IMPORTANTE: Añadimos records_format=objects para que no devuelva null
    const apiBase = "https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql?records_format=objects&sql=";

    // Queries (Usando el formato numérico que te funcionó en el test)
    const sqlDet = `SELECT * FROM "${ids.detalle}" WHERE "CODIGO_UNICO" = ${cui}`;
    const sqlF12 = `SELECT * FROM "${ids.f12b}" WHERE "CODIGO_UNICO" = ${cui}`;
    const sqlSit = `SELECT * FROM "${ids.situacion}" WHERE "CODIGO_UNICO" = ${cui}`;

    try {
        const [rDet, rF12, rSit] = await Promise.all([
            fetch(proxy + encodeURIComponent(apiBase + sqlDet)).then(r => r.json()),
            fetch(proxy + encodeURIComponent(apiBase + sqlF12)).then(r => r.json()),
            fetch(proxy + encodeURIComponent(apiBase + sqlSit)).then(r => r.json())
        ]);

        // Verificamos "sucess" con doble S como sale en tu captura
        if ((rDet.sucess === "true" || rDet.success) && rDet.result.records && rDet.result.records.length > 0) {
            const d = rDet.result.records[0];
            const f = (rF12.result && rF12.result.records) ? rF12.result.records[0] : {};
            const s = (rSit.result && rSit.result.records) ? rSit.result.records[0] : {};

            resDiv.innerHTML = `
                <div class="col-12">
                    <div class="card card-resultado p-4 bg-white">
                        <h4 class="fw-bold text-primary mb-3">${d.NOMBRE_INVERSION || 'SIN NOMBRE'}</h4>
                        <div class="row">
                            <div class="col-md-4 border-end">
                                <span class="mef-label">Monto de Inversión</span>
                                <div class="mef-value">S/ ${parseFloat(d.COSTO_ACTUALIZADO || 0).toLocaleString()}</div>
                                <span class="mef-label">Estado Actual</span>
                                <div class="mef-value"><span class="badge bg-info text-dark">${d.ESTADO_NOMBRE || 'En Ejecución'}</span></div>
                            </div>
                            <div class="col-md-4 border-end text-center">
                                <span class="mef-label">Avance Físico (F12B)</span>
                                <div class="display-6 fw-bold text-success">${f.AVANCE_FISICO_REAL || 0}%</div>
                                <span class="mef-label">Acción Pendiente</span>
                                <div class="small text-muted">${f.ACCION_REALIZAR_ESTADO || 'Sin reporte'}</div>
                            </div>
                            <div class="col-md-4">
                                <span class="mef-label text-danger">⚠️ Situación Problemática</span>
                                <p class="small text-danger mt-2">${s.DESCRIPCION_SITUACION || 'No se registran problemas.'}</p>
                                <span class="mef-label">Fecha Reporte</span>
                                <div class="mef-value">${s.FECHA_REGISTRO || '-'}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
        } else {
            resDiv.innerHTML = `<div class="alert alert-warning shadow-sm">No se encontraron registros para el CUI ${cui}. Verifica que el código sea correcto.</div>`;
        }
    } catch (error) {
        resDiv.innerHTML = `<div class="alert alert-danger shadow-sm">Error de conexión con el MEF. Intenta nuevamente.</div>`;
    } finally {
        loader.style.display = "none";
    }
}
</script>
</body>
</html>
