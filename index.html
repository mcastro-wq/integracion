<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Directa MEF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded" style="max-width: 600px;">
        <h4 class="mb-4">🔍 Buscador Directo MEF (Lambayeque)</h4>
        
        <div class="input-group mb-3">
            <input type="text" id="cuiInput" class="form-control" placeholder="Ingrese CUI (ej. 2199528)">
            <button class="btn btn-primary" onclick="buscarCUI()">Buscar</button>
        </div>

        <div id="loader" class="text-center d-none">
            <div class="spinner-border spinner-border-sm text-primary"></div> Consultando MEF...
        </div>

        <div id="resultado" class="mt-4"></div>
    </div>

<script>
async function buscarCUI() {
    const cui = document.getElementById('cuiInput').value.trim();
    const resDiv = document.getElementById('resultado');
    const loader = document.getElementById('loader');

    if (!cui) return;
    
    loader.classList.remove('d-none');
    resDiv.innerHTML = "";

    // Tus IDs de recursos
    const idDetalle = "f9cc4ba0-931a-4b70-86c9-eacbd8c68596";
    const idSituacion = "2c20b8e2-7bd9-41ba-8239-8f8c9571935a";

    // SQL dinámico: buscamos el CUI exacto
    const sql = `SELECT * FROM "${idDetalle}" WHERE "CODIGO_UNICO" = '${cui}'`;
    const sqlSit = `SELECT * FROM "${idSituacion}" WHERE "CODIGO_UNICO" = '${cui}'`;

    // Usamos un proxy para evitar el bloqueo de seguridad (CORS)
    const proxy = "https://corsproxy.io/?";
    const baseUrl = "https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql?sql=";

    try {
        // Consultamos Detalle
        const resp = await fetch(proxy + encodeURIComponent(baseUrl + sql));
        const data = await resp.json();

        if (data.success && data.result.records.length > 0) {
            const p = data.result.records[0];

            // Consultamos Situación
            const resp2 = await fetch(proxy + encodeURIComponent(baseUrl + sqlSit));
            const data2 = await resp2.json();
            const s = data2.result.records[0];

            resDiv.innerHTML = `
                <div class="card border-primary shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-primary">${p.NOMBRE_INVERSION}</h5>
                        <p class="card-text"><strong>CUI:</strong> ${p.CODIGO_UNICO}</p>
                        <p class="card-text"><strong>Costo Actualizado:</strong> S/ ${parseFloat(p.COSTO_ACTUALIZADO).toLocaleString()}</p>
                        <hr>
                        <h6 class="text-danger">⚠️ Situación:</h6>
                        <p class="small text-muted">${s ? s.DESCRIPCION_SITUACION : 'No registra problemas en la API.'}</p>
                    </div>
                </div>`;
        } else {
            resDiv.innerHTML = `<div class="alert alert-warning">No se encontró el CUI ${cui} en el MEF.</div>`;
        }
    } catch (e) {
        resDiv.innerHTML = `<div class="alert alert-danger">Error: No se pudo conectar con el MEF. Intente de nuevo.</div>`;
    } finally {
        loader.classList.add('d-none');
    }
}
</script>
</body>
</html>
