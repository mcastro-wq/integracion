name: Actualizar Data Maestro Inversiones

on:
  schedule:
    # Ejecuta a las 00:00 y 12:00 UTC (Cada 12 horas)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias
        run: pip install pandas requests

      - name: Ejecutar Scraper y Cruce de Datos
        run: python scraper.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          if [ -f data_cruzada.json ]; then
            git add data_cruzada.json
            git commit -m "Auto-Update: $(date +'%Y-%m-%d %H:%M')" || exit 0
            git push
          fi
