name: Actualizacion Masiva de Datos MEF

on:
  schedule:
    - cron: '0 */12 * * *' # Cada 12 horas
  workflow_dispatch: # Botón para ejecutar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias
        run: pip install pandas requests

      - name: Ejecutar Descarga Cruda
        run: python scraper.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Agregamos los archivos uno por uno. Si no existe alguno, el '|| true' evita que el proceso muera.
          git add data_detalle.json || true
          git add data_situacion.json || true
          git add data_f12b.json || true
          
          # Solo hacemos commit si hay algo nuevo que subir
          git commit -m "Update Data Regional: $(date +'%Y-%m-%d %H:%M')" || echo "No hay cambios para subir"
          git push || echo "No se pudo hacer push"
