name: Actualizacion Masiva de Datos

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta a medianoche automáticamente
  push:
    branches: [ main ]
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias
        run: pip install requests pandas

      - name: Ejecutar Descarga API SQL
        run: python scraper.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Agregamos los 3 archivos generados por la API
          git add data_detalle.json data_f12b.json data_situacion.json || true
          
          # Hacemos commit solo si hay cambios reales
          git commit -m "Update Lambayeque Data via API SQL: $(date +'%Y-%m-%d')" || echo "No hay cambios para subir"
          git push
