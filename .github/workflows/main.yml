name: Dashboard Regional Lambayeque - AutoUpdate

on:
  schedule:
    # Se ejecuta cada 12 horas (00:00 y 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite ejecución manual para pruebas

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias
        run: |
          pip install pandas requests

      - name: Ejecutar Integracion de Datos
        run: python scraper.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          if [ -f data_cruzada.json ]; then
            git add data_cruzada.json
            git commit -m "Corte de datos: $(date +'%Y-%m-%d %H:%M')" || exit 0
            git push
          else
            echo "Error: data_cruzada.json no generado."
            exit 1
          fi
