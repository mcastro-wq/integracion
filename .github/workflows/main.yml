name: Integracion Datos MEF Lambayeque Masivo

on:
  schedule:
    # Se ejecuta cada 12 horas (00:00 y 12:00 UTC)
    - cron: '0 */12 * * *'  
  workflow_dispatch:      
    # Permite ejecución manual desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    # Tiempo límite de 15 min por la carga de archivos pesados del MEF
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Ejecutar Integracion de Datos
        # Este paso corre el scraper.py que creamos anteriormente
        run: python scraper.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Verificamos si el archivo se generó antes de subirlo
          if [ -f data_cruzada.json ]; then
            git add data_cruzada.json
            # El "|| exit 0" evita que el proceso falle si no hubo cambios en la data
            git commit -m "Actualización Semestral de Datos: $(date +'%Y-%m-%d %H:%M')" || exit 0
            git push
          else
            echo "Error: No se encontró el archivo data_cruzada.json"
            exit 1
          fi
